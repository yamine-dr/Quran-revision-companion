<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section>
      <div id="surah-card">
        <div>
          Name of the Surah <span id="surah-number"><!-- number injected here --></span>?
        </div>
        <div>
          <form>
            <input type="text" aria-label="Answer" placeholder="enter surah name">
            <button type="submit">Submit Answer</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
