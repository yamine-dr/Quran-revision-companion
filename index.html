<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Quiz - Find Surah Number</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Quiz: Find Surah Number From its Name</h1>
    <section class="quiz">
      <div class="quiz-card">
        <p>
          Number of the surah <span id="surah-name"><!-- surah name here --></span>?
        </p>
        <input id="answer-input" type="text" aria-label="Answer" placeholder="enter surah number">
        <button id="submit-btn">Submit Answer</button>
        <button id="next-btn">Next</button>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
