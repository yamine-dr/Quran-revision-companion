<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section>
      <div id="surah-card">
        <div>
          Name of the Surah <span id="surah-number"><!-- number injected here --></span>?
        </div>
        <div>
          <form>
            <input type="text" aria-label="Answer" placeholder="enter surah name">
            <button type="submit">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right w-5 h-5" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
