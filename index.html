<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="surah-number-quiz">
      <h2>Quiz: Find Surah Number From its Name</h2>
      
      <div class="card">
        <p>
          Number of the surah <span id="surah-name"><!-- name injected here --></span>?
        </p>
        <form id="surah-number-quiz-form" autocomplete="off">
          <input id="surah-number-quiz-input" type="text" aria-label="Answer" placeholder="enter surah number">
          <button id="surah-number-quiz-submit">Submit Answer</button>
        </form>
        <div id="answer-feedback"></div>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
